global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Auto-monitoreo del propio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Chequeos externos de sitios web (WordPress o cualquier página) ──
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # ▼▼ Sitios NO-WordPress (chequeo HTTP genérico) ▼▼
          # No importa dónde esté alojado cada sitio: el chequeo es una
          # petición HTTP externa, como la de un visitante real.
          - https://favric.cl
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Sitios WordPress: igual que arriba + verificación de contenido ──
  # El módulo http_2xx_wordpress exige que el HTML contenga wp-content/
  # wp-includes: detecta defacement o redirecciones por .htaccess hackeado
  # (alerta ContenidoSospechoso).
  - job_name: blackbox_wordpress
    metrics_path: /probe
    params:
      module: [http_2xx_wordpress]
    static_configs:
      - targets:
          # ▼▼ Sitios WordPress ▼▼
          - https://laderasdelrupanco.cl    # en este servidor
          - https://idrispatagonia.com     # otro hosting
          - https://patagoniafarming.com   # otro hosting
          - https://marandino.com          # otro hosting
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── (Opcional) Servicios internos del servidor sin URL pública ──
  # Si algún día quieres vigilar los backends de tu docker ps (ej: el
  # puerto 8000 de ms-catalogue), se agrega otro job igual al de arriba
  # pero con targets tipo http://host.docker.internal:<puerto> y módulo
  # http_alive. Avísame y lo armamos.

  # ── Fase 2: métricas internas de WordPress (plugin favric-monitor) ──
  # Receta completa para agregar un sitio: docs/agregar-sitio.md
  # (instalar plugin → guardar token en prometheus/secrets/ → copiar un
  #  job como el de abajo → docker compose restart prometheus)

  - job_name: wp_laderas
    metrics_path: /wp-json/favric-monitor/v1/metrics
    scheme: https
    scrape_interval: 5m        # métricas internas: no hace falta cada 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/laderas.token
    static_configs:
      - targets: ["laderasdelrupanco.cl"]

  # Requiere: echo -n 'TOKEN' > prometheus/secrets/marandino.token
  - job_name: wp_marandino
    metrics_path: /wp-json/favric-monitor/v1/metrics
    scheme: https
    scrape_interval: 5m
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/marandino.token
    static_configs:
      - targets: ["marandino.com"]

  # Descomenta cuando confirmes el plugin activo en idris y guardes:
  #   echo -n 'TOKEN' > prometheus/secrets/idris.token
  # - job_name: wp_idris
  #   metrics_path: /wp-json/favric-monitor/v1/metrics
  #   scheme: https
  #   scrape_interval: 5m
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/secrets/idris.token
  #   static_configs:
  #     - targets: ["idrispatagonia.com"]
