groups:
  - name: sitios
    rules:
      - alert: SitioCaido
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sitio caído: {{ $labels.instance }}"
          description: "{{ $labels.instance }} no responde hace más de 2 minutos."

      - alert: SitioLento
        expr: probe_duration_seconds > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sitio lento: {{ $labels.instance }}"
          description: "{{ $labels.instance }} tarda {{ $value | printf \"%.1f\" }}s en responder (>3s por 5 min)."

      - alert: CertificadoSSLPorVencer
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 15
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL por vencer: {{ $labels.instance }}"
          description: "El certificado de {{ $labels.instance }} vence en {{ $value | printf \"%.0f\" }} días."

      - alert: ContenidoSospechoso
        expr: probe_failed_due_to_regex == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Contenido sospechoso en {{ $labels.instance }}"
          description: "{{ $labels.instance }} responde pero su HTML ya no parece WordPress — posible defacement o redirección maliciosa (.htaccess hackeado)."

  - name: wordpress
    rules:
      - alert: ArchivoCriticoModificado
        expr: wp_file_integrity_changed == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Archivo crítico modificado en {{ $labels.instance }}"
          description: "El archivo {{ $labels.file }} de {{ $labels.instance }} cambió respecto a la línea base. Si fue un cambio legítimo, actualiza la línea base en Ajustes → Favric Monitor."

      - alert: PluginsDesactualizados
        expr: wp_plugin_updates_pending > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Plugins desactualizados en {{ $labels.instance }}"
          description: "{{ $labels.instance }} lleva más de 24h con {{ $value | printf \"%.0f\" }} plugin(s) sin actualizar."

      - alert: PicoLoginsFallidos
        expr: increase(wp_login_failures_total[1h]) > 50
        labels:
          severity: critical
        annotations:
          summary: "Posible ataque de fuerza bruta en {{ $labels.instance }}"
          description: "{{ $value | printf \"%.0f\" }} intentos de login fallidos en la última hora en {{ $labels.instance }}."

      - alert: WPCronAtrasado
        expr: wp_cron_overdue_events > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "WP-Cron atrasado en {{ $labels.instance }}"
          description: "{{ $labels.instance }} tiene {{ $value | printf \"%.0f\" }} eventos de cron atrasados hace más de 1 hora."

