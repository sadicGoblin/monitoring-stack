modules:
  # Chequeo HTTP estándar: espera 2xx, sigue redirects, valida SSL
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: []   # vacío = cualquier 2xx

  # Chequeo para sitios WordPress: además de 2xx, exige que el HTML
  # parezca WordPress. Detecta defacement o redirecciones de hackeo
  # (ej: .htaccess modificado que manda a un sitio de spam).
  http_2xx_wordpress:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: []
      fail_if_body_not_matches_regexp:
        - "wp-content|wp-includes"

  # Para endpoints internos que responden 401/403 (igual prueba que están vivos)
  http_alive:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [200, 301, 302, 401, 403]

  # Chequeo TCP simple (ej: puertos de BD)
  tcp_connect:
    prober: tcp
    timeout: 10s
